<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오리 쌓기 🦆</title>
<style>
:root{--bg:#fff6d6;--fg:#5a3b00;--card:#ffffffcc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d2540;--fg:#ffe9a8;--card:#2b3556cc}}
:root[data-theme="dark"]{--bg:#1d2540;--fg:#ffe9a8;--card:#2b3556cc}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#wrap{position:relative;height:calc(100% - 56px);max-height:640px;aspect-ratio:360/600;max-width:100%}
canvas{width:100%;height:100%;border-radius:16px;display:block;box-shadow:0 6px 24px #0003}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--card);border-radius:16px;padding:20px;gap:8px}
#ov.hide{display:none}
h1{margin:0;font-size:32px}
p{margin:0;line-height:1.5}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:10px 22px;background:#ffc21a;color:#5a3b00;cursor:pointer}
button.s{background:transparent;color:var(--fg);border:2px solid var(--fg);padding:6px 16px;font-size:14px}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="360" height="600"></canvas>
<div id="ov">
<h1>🦆 오리 쌓기</h1>
<p id="msg">화면을 탭해서 오리를 떨어뜨려요.<br>아래 오리 위에 딱 맞게 쌓아보세요!<br>가운데에 정확히 놓으면 <b>완벽!</b> 보너스</p>
<p id="best"></p>
<button id="go">시작하기</button>
</div>
</div>
<button class="s" id="share">🔗 친구에게 링크 공유</button>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=360,H=600,S=56,STEP=40,BASE=H-90;
const ov=document.getElementById('ov'),msg=document.getElementById('msg'),bestEl=document.getElementById('best');
let best=0;try{best=+localStorage.getItem('duckBest')||0}catch(e){}
let stack,cur,score,combo,state,cam,camT,fx,fall,t=0;
function showBest(){bestEl.textContent=best?'🏆 최고 기록: '+best+'층':''}
showBest();
function reset(){
  stack=[W/2];score=0;combo=0;cam=0;camT=0;fx=[];fall=null;state='play';
  spawn();
}
function spawn(){
  const dir=Math.random()<.5?1:-1;
  cur={x:dir>0?S/2:W-S/2,dir,sp:2+Math.min(score*.12,4.5),y:0,vy:0,drop:false};
}
function levelY(i){return BASE-i*STEP}
function tap(){
  if(state!=='play'||cur.drop)return;
  cur.drop=true;cur.vy=0;cur.y=levelY(stack.length)-140;
}
function over(){
  state='over';
  if(score>best){best=score;try{localStorage.setItem('duckBest',best)}catch(e){}}
  msg.innerHTML='<b style="font-size:22px">게임 끝!</b><br>'+score+'층까지 쌓았어요'+(score>=best&&score>0?' 🎉 신기록!':'');
  showBest();document.getElementById('go').textContent='다시 도전';
  ov.classList.remove('hide');
}
function update(){
  t++;
  if(state==='play'&&cur){
    if(!cur.drop){
      cur.x+=cur.dir*cur.sp;
      if(cur.x>W-S/2){cur.x=W-S/2;cur.dir=-1}
      if(cur.x<S/2){cur.x=S/2;cur.dir=1}
      cur.y=levelY(stack.length)-140+Math.sin(t/8)*4;
    }else{
      cur.vy+=1.2;cur.y+=cur.vy;
      const ty=levelY(stack.length);
      if(!fall&&cur.y>=ty){
        const dx=cur.x-stack[stack.length-1];
        if(Math.abs(dx)>S*.72){fall={x:cur.x,y:cur.y,vy:0,r:0,dir:dx>0?1:-1};cur=null;setTimeout(over,700);return}
        if(Math.abs(dx)<7){cur.x=stack[stack.length-1];combo++;score+=1+Math.min(combo,5)-1;fx.push({x:cur.x,y:ty,t:0,txt:combo>1?'완벽! x'+combo:'완벽!'})}
        else{combo=0;score+=1}
        stack.push(cur.x);
        camT=Math.max(0,(stack.length-1)*STEP-300);
        spawn();
      }
    }
  }
  if(fall){fall.vy+=1;fall.y+=fall.vy;fall.x+=fall.dir*3;fall.r+=fall.dir*.1}
  cam+=(camT-cam)*.1;
  fx.forEach(f=>f.t++);fx=fx.filter(f=>f.t<40);
}
function duck(x,y,r){
  ctx.save();ctx.translate(x,y);if(r)ctx.rotate(r);
  ctx.font=S+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('🦆',0,0);ctx.restore();
}
function draw(){
  const g=ctx.createLinearGradient(0,0,0,H);
  const h=Math.min(cam/1500,1);
  g.addColorStop(0,`rgb(${135-h*110|0},${206-h*160|0},${250-h*120|0})`);
  g.addColorStop(1,`rgb(${255-h*100|0},${240-h*120|0},${200-h*40|0})`);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // clouds
  ctx.fillStyle='#ffffff99';
  for(let i=0;i<4;i++){const cy=(i*170+cam*.3)%(H+80)-40;ctx.beginPath();ctx.ellipse((i*97+40)%W,cy,42,14,0,0,7);ctx.fill()}
  // pond
  const py=BASE+S/2-6+cam;
  if(py<H){ctx.fillStyle='#3aa0e8';ctx.fillRect(0,py,W,H-py);ctx.fillStyle='#ffffff55';for(let i=0;i<6;i++){ctx.fillRect((i*70+t)%W,py+8+(i%3)*10,30,3)}}
  stack.forEach((x,i)=>duck(x,levelY(i)+cam,0));
  if(cur)duck(cur.x,cur.y+cam,0);
  if(fall)duck(fall.x,fall.y+cam,fall.r);
  ctx.textAlign='center';ctx.font='bold 18px sans-serif';
  fx.forEach(f=>{ctx.globalAlpha=1-f.t/40;ctx.fillStyle='#fff';ctx.strokeStyle='#e08a00';ctx.lineWidth=4;
    ctx.strokeText(f.txt,f.x,f.y+cam-30-f.t);ctx.fillText(f.txt,f.x,f.y+cam-30-f.t);ctx.globalAlpha=1});
  ctx.font='bold 34px sans-serif';ctx.strokeStyle='#0006';ctx.lineWidth=5;ctx.fillStyle='#fff';
  ctx.strokeText(score,W/2,50);ctx.fillText(score,W/2,50);
  ctx.font='14px sans-serif';ctx.fillStyle='#fff';ctx.strokeText('최고 '+best,W-40,24);ctx.fillText('최고 '+best,W-40,24);
}
function loop(){update();draw();requestAnimationFrame(loop)}
reset();state='idle';cur=null;loop();
document.getElementById('go').onclick=e=>{e.stopPropagation();ov.classList.add('hide');reset()};
cv.addEventListener('pointerdown',e=>{e.preventDefault();tap()});
window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();tap()}});
document.getElementById('share').onclick=async()=>{
  const b=document.getElementById('share'),url=location.href,txt='오리 쌓기 게임 같이 해봐! 🦆';
  try{if(navigator.share){await navigator.share({title:'오리 쌓기',text:txt,url});return}}catch(e){}
  try{await navigator.clipboard.writeText(url);b.textContent='✅ 링크 복사됨!'}catch(e){b.textContent='주소창의 링크를 복사해 주세요'}
  setTimeout(()=>b.textContent='🔗 친구에게 링크 공유',2000);
};
</script>
</body>
</html>
